name: "Repo Sync"

on:
  schedule:
    # at 07:15 AM every day
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    name: Repo sync
    steps:
      - name: Repo sync
        run: |
          git clone --bare https://git.yoctoproject.org/git/poky .
          git remote add github https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push github 'refs/heads/*:refs/heads/*' --force --prune
          git push github 'refs/tags/*:refs/tags/*' --force --prune
